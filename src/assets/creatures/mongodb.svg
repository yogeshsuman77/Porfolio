<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-mongo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mongo-leaf { animation: mongo-bob 4.2s ease-in-out infinite; }
    .mongo-leaf-1 { animation-delay: 0s; transform-origin: 148px 128px; }
    .mongo-leaf-2 { animation-delay: 0.5s; transform-origin: 158px 112px; }
    .mongo-leaf-3 { animation-delay: 1s; transform-origin: 144px 100px; }
    @keyframes mongo-bob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3px) rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) {
      .mongo-leaf { animation: none; }
    }
  </style>

  <!-- the leaf-shaped documents it guards -->
  <g fill="#161409" stroke="#4caf50" stroke-width="1.6" filter="url(#glow-mongo)">
    <path class="mongo-leaf mongo-leaf-1" d="M148,120 C 140,120 134,126 134,134 C 134,140 140,144 148,144 C 148,132 148,126 148,120 Z"/>
    <path class="mongo-leaf mongo-leaf-2" d="M158,104 C 150,104 144,110 144,118 C 144,124 150,128 158,128 C 158,116 158,110 158,104 Z"/>
    <path class="mongo-leaf mongo-leaf-3" d="M144,92 C 136,92 130,98 130,106 C 130,112 136,116 144,116 C 144,104 144,98 144,92 Z"/>
  </g>

  <!-- sturdy round body, low stance -->
  <path d="M 56,122 C 50,96 76,72 106,76 C 132,80 140,102 134,124 C 128,144 62,144 56,122 Z"
        fill="#17150f" stroke="#3a3d27" stroke-width="1.4"/>

  <!-- shell ridges -->
  <path d="M 78,86 C 74,102 74,116 78,132" stroke="#2c2a1c" stroke-width="1.6" fill="none"/>
  <path d="M 100,80 C 98,98 98,116 100,136" stroke="#2c2a1c" stroke-width="1.6" fill="none"/>

  <!-- calm watching eyes -->
  <circle cx="82" cy="104" r="3.6" fill="#4caf50" filter="url(#glow-mongo)"/>
  <circle cx="102" cy="102" r="3.6" fill="#4caf50" filter="url(#glow-mongo)"/>

  <!-- sturdy legs -->
  <ellipse cx="70" cy="148" rx="10" ry="4.6" fill="#17150f"/>
  <ellipse cx="104" cy="150" rx="10" ry="4.6" fill="#17150f"/>
</svg>
