<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-react" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .react-rings { transform-origin: 100px 60px; animation: react-spin 16s linear infinite; }
    .react-bob { animation: react-bob 5s ease-in-out infinite; transform-origin: 100px 120px; }
    @keyframes react-spin { to { transform: rotate(360deg); } }
    @keyframes react-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      .react-rings, .react-bob { animation: none; }
    }
  </style>

  <g class="react-bob">
    <!-- legs -->
    <path d="M 86,152 C 78,162 72,166 62,172" stroke="#2a2620" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 100,155 C 100,164 100,168 100,176" stroke="#2a2620" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 114,152 C 122,162 128,166 138,172" stroke="#2a2620" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- three petals -->
    <g fill="#171512" stroke="#61dafb" stroke-width="1.4" stroke-opacity="0.55">
      <path transform="translate(100,120) rotate(0)"   d="M 0,0 C -24,-13 -30,-38 0,-56 C 30,-38 24,-13 0,0 Z"/>
      <path transform="translate(100,120) rotate(120)" d="M 0,0 C -24,-13 -30,-38 0,-56 C 30,-38 24,-13 0,0 Z" opacity="0.94"/>
      <path transform="translate(100,120) rotate(240)" d="M 0,0 C -24,-13 -30,-38 0,-56 C 30,-38 24,-13 0,0 Z" opacity="0.94"/>
    </g>

    <!-- hub -->
    <circle cx="100" cy="120" r="15" fill="#1b1814" stroke="#61dafb" stroke-width="1.4" stroke-opacity="0.6"/>

    <!-- curious eyes -->
    <circle cx="93" cy="82" r="3" fill="#61dafb" filter="url(#glow-react)"/>
    <circle cx="108" cy="80" r="3.6" fill="#61dafb" filter="url(#glow-react)"/>
  </g>

  <!-- the react atom, worn like a crown, slowly rotating -->
  <g transform="translate(0,-12)">
    <g class="react-rings" filter="url(#glow-react)" fill="none" stroke="#61dafb" stroke-width="2.6">
      <ellipse cx="100" cy="60" rx="30" ry="11"/>
      <ellipse cx="100" cy="60" rx="30" ry="11" transform="rotate(60 100 60)"/>
      <ellipse cx="100" cy="60" rx="30" ry="11" transform="rotate(120 100 60)"/>
      <circle cx="100" cy="60" r="4.4" fill="#61dafb" stroke="none"/>
    </g>
  </g>
</svg>
