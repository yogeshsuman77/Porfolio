<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- glowing core, sitting beside the creature -->
  <circle cx="102" cy="88" r="4.2" fill="#f1720c" filter="url(#glow)" opacity="0.9"/>

  <g transform="translate(62,82)">
    <!-- tail curled around -->
    <path d="M 20,18 C 34,20 40,10 34,-2" stroke="#211f1b" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="0" cy="0" rx="26" ry="22" fill="#1c1a17" stroke="#423c33" stroke-width="1"/>
    <!-- ear tufts -->
    <path d="M -14,-19 C -16,-27 -10,-29 -6,-23" fill="#1c1a17" stroke="#423c33" stroke-width="1"/>
    <path d="M 14,-19 C 16,-27 10,-29 6,-23" fill="#1c1a17" stroke="#423c33" stroke-width="1"/>

    <!-- calm sleepy eyes -->
    <path d="M -13,-3 Q -8,1 -3,-3" stroke="#f1720c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 3,-3 Q 8,1 13,-3" stroke="#f1720c" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- feet -->
    <ellipse cx="-10" cy="21" rx="6" ry="3" fill="#1c1a17"/>
    <ellipse cx="10" cy="21" rx="6" ry="3" fill="#1c1a17"/>
  </g>
</svg>
