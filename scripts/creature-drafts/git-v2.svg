<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-git" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .git-commit { animation: none !important; }
    }
  </style>

  <!-- faint echo of itself, offset — another branch of the same timeline -->
  <g transform="translate(16,-8)" opacity="0.16">
    <path d="M 60,120 C 58,96 84,76 108,80 C 128,84 136,100 130,118 C 124,134 64,134 60,120 Z" fill="#221f19"/>
  </g>

  <!-- the branch graph it's holding, a commit travelling through it -->
  <g filter="url(#glow-git)" stroke="#f0684a" stroke-width="2.2" fill="none">
    <path d="M 148,140 C 148,120 148,110 162,100"/>
    <path d="M 148,140 L 148,96"/>
    <circle cx="148" cy="140" r="3.4" fill="#f0684a" stroke="none"/>
    <circle cx="148" cy="96" r="3.4" fill="#f0684a" stroke="none"/>
    <circle cx="162" cy="100" r="3.4" fill="#f0684a" stroke="none"/>
  </g>
  <circle class="git-commit" r="3.8" fill="#fff" filter="url(#glow-git)">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M 148,140 C 148,120 148,110 162,100 L 162,100" rotate="auto"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- branching tendrils (legs) -->
  <path d="M 76,146 C 66,154 58,154 46,162" stroke="#211f19" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 90,150 C 90,160 92,166 92,178" stroke="#211f19" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 104,146 C 114,152 120,158 132,164" stroke="#211f19" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="46" cy="162" r="3" fill="#211f19"/>
  <circle cx="92" cy="178" r="3" fill="#211f19"/>
  <circle cx="132" cy="164" r="3" fill="#211f19"/>

  <!-- main body -->
  <path d="M 60,120 C 58,96 84,76 108,80 C 128,84 136,100 130,118 C 124,134 64,134 60,120 Z"
        fill="#17150f" stroke="#3a2f27" stroke-width="1.4"/>

  <!-- one watchful eye -->
  <circle cx="94" cy="104" r="4.6" fill="#f0684a" filter="url(#glow-git)"/>
  <circle cx="94" cy="104" r="9" fill="none" stroke="#f0684a" stroke-width="1" opacity="0.4"/>
</svg>
