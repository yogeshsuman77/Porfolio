<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(70,80)">
    <!-- legs -->
    <path d="M -6,28 C -12,36 -16,40 -22,44" stroke="#2a2620" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M 0,30 C 0,38 0,42 0,48" stroke="#2a2620" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M 6,28 C 12,36 16,40 22,44" stroke="#2a2620" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- three petals, rotated -->
    <g fill="#1d1a16" stroke="#453f36" stroke-width="1">
      <path transform="rotate(0)"   d="M 0,0 C -17,-9 -21,-27 0,-40 C 21,-27 17,-9 0,0 Z"/>
      <path transform="rotate(120)" d="M 0,0 C -17,-9 -21,-27 0,-40 C 21,-27 17,-9 0,0 Z" opacity="0.92"/>
      <path transform="rotate(240)" d="M 0,0 C -17,-9 -21,-27 0,-40 C 21,-27 17,-9 0,0 Z" opacity="0.92"/>
    </g>

    <!-- hub -->
    <circle r="11" fill="#211e19" stroke="#4a4338" stroke-width="1"/>

    <!-- eyes on the front-facing petal -->
    <circle cx="-5" cy="-27" r="2.1" fill="#f1720c"/>
    <circle cx="5" cy="-27" r="2.1" fill="#f1720c"/>
  </g>
</svg>
