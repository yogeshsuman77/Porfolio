    <path d="M 0,16 C 0,24 2,28 2,36" stroke="#221f19" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 6,14 C 14,18 18,22 26,26" stroke="#221f19" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-28" cy="26" r="2.2" fill="#221f19"/>
