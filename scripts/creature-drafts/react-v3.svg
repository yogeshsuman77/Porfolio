<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-react" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .react-rings { transform-origin: 100px 62px; animation: react-spin 12s linear infinite; }
    .react-bob { animation: react-bob 4.4s ease-in-out infinite; transform-origin: 100px 150px; }
    @keyframes react-spin { to { transform: rotate(360deg); } }
    @keyframes react-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      .react-rings, .react-bob { animation: none; }
    }
  </style>

  <g class="react-bob">
    <!-- stubby feet -->
    <ellipse cx="82" cy="176" rx="13" ry="7" fill="#171512"/>
    <ellipse cx="118" cy="176" rx="13" ry="7" fill="#171512"/>

    <!-- round cute body -->
    <ellipse cx="100" cy="132" rx="42" ry="40" fill="#171512" stroke="#61dafb" stroke-width="1.6" stroke-opacity="0.55"/>

    <!-- little nubby arms, resting -->
    <ellipse cx="60" cy="140" rx="8" ry="11" fill="#171512" stroke="#61dafb" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(18 60 140)"/>
    <ellipse cx="140" cy="140" rx="8" ry="11" fill="#171512" stroke="#61dafb" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(-18 140 140)"/>

    <!-- happy round eyes -->
    <circle cx="86" cy="126" r="5" fill="#61dafb" filter="url(#glow-react)"/>
    <circle cx="114" cy="126" r="5" fill="#61dafb" filter="url(#glow-react)"/>
    <!-- little smile -->
    <path d="M 90,142 Q 100,150 110,142" stroke="#4fb8d6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- rosy cheeks -->
    <circle cx="74" cy="138" r="4.5" fill="#61dafb" opacity="0.18"/>
    <circle cx="126" cy="138" r="4.5" fill="#61dafb" opacity="0.18"/>
  </g>

  <!-- the react atom, held aloft, spinning happily -->
  <g class="react-rings" filter="url(#glow-react)" fill="none" stroke="#61dafb" stroke-width="3">
    <ellipse cx="100" cy="62" rx="32" ry="12"/>
    <ellipse cx="100" cy="62" rx="32" ry="12" transform="rotate(60 100 62)"/>
    <ellipse cx="100" cy="62" rx="32" ry="12" transform="rotate(120 100 62)"/>
    <circle cx="100" cy="62" r="5" fill="#61dafb" stroke="none"/>
  </g>
</svg>
